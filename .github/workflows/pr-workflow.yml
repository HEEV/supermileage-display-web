# Dependency Review is a tool for identifying and reporting
# vulnerabilities in dependencies of a project. This workflow
# is performing code quality and security checks the appropriate
# code changes.
# This workflow could have stages added to it later to do 
# code scanning and other security checks. Currently it is
# running the bare minimum.


name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

jobs:
  eslint:
    name: Run eslint scanning
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          npm install @microsoft/eslint-formatter-sarif@3.1.0 --no-save

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint .
          --config eslint.config.mjs
          --ignore-pattern "node_modules/"
          --ignore-pattern "build/"
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
  dependency-review:
    name: Run Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
