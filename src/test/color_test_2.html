<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
    <!-- brought to us by ChatGPT -->
<title>Dynamic Brightness & Contrast</title>
<style>
  :root {
    /* base filter values (can be changed by JS) */
    --brightness: 1;
    --contrast: 1;

    /* color palette */
    --white: #FFFFFF;
    --sky-light: #61CBF4;
    --sky: #00A8FF;
    --blue: #007BFF;
    --mint: #00FF88;
    --green: #00E060;
    --red: #FF0000;
    --yellow: #FFD500;
    --orange: #FF8C00;
    --light-blue: #7FC8F9;
    --gray: #7F7F7F;
  }

  body {
    font-family: sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
  }

  .controls {
    margin-bottom: 20px;
  }

  .swatch {
    width: 90px;
    height: 90px;
    display: inline-block;
    border-radius: 10px;
    margin: 6px;
    filter: brightness(var(--brightness)) contrast(var(--contrast));
    transition: filter 0.2s ease;
  }
</style>
</head>
<body>
  <h2>Interactive Brightness & Contrast</h2>

  <div class="controls">
    <label>Brightness: <span id="bVal">1.0</span></label>
    <input type="range" id="brightness" min="0.5" max="1.5" step="0.05" value="1">
    <br><br>
    <label>Contrast: <span id="cVal">1.0</span></label>
    <input type="range" id="contrast" min="0.5" max="1.5" step="0.05" value="1">
  </div>

  <div id="palette">
    <div class="swatch" style="background: var(--white)"></div>
    <div class="swatch" style="background: var(--sky-light)"></div>
    <div class="swatch" style="background: var(--sky)"></div>
    <div class="swatch" style="background: var(--blue)"></div>
    <div class="swatch" style="background: var(--mint)"></div>
    <div class="swatch" style="background: var(--green)"></div>
    <div class="swatch" style="background: var(--red)"></div>
    <div class="swatch" style="background: var(--yellow)"></div>
    <div class="swatch" style="background: var(--orange)"></div>
    <div class="swatch" style="background: var(--light-blue)"></div>
    <div class="swatch" style="background: var(--gray)"></div>
  </div>

  <script>
    // JS variables for brightness and contrast
    let brightness = 1.0;
    let contrast = 1.0;

    const bSlider = document.getElementById('brightness');
    const cSlider = document.getElementById('contrast');
    const bVal = document.getElementById('bVal');
    const cVal = document.getElementById('cVal');

    function updateFilters() {
      // Update CSS variables dynamically
      document.documentElement.style.setProperty('--brightness', brightness);
      document.documentElement.style.setProperty('--contrast', contrast);
      bVal.textContent = brightness.toFixed(2);
      cVal.textContent = contrast.toFixed(2);
    }

    bSlider.addEventListener('input', e => {
      brightness = parseFloat(e.target.value);
      updateFilters();
    });

    cSlider.addEventListener('input', e => {
      contrast = parseFloat(e.target.value);
      updateFilters();
    });

    // Initialize display
    updateFilters();
  </script>
</body>
</html>
