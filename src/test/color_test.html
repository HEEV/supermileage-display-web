<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
      <!-- brought to us by ChatGPT -->
  <title>Color Scheme with Brightness & Contrast</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .color-box {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      display: inline-block;
      margin: 8px;
    }
    .label {
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }
    .grid {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h2>Base Colors</h2>
  <div class="grid">
    <div class="color-box" style="background:#000000"></div>
    <div class="color-box" style="background:#ffffff"></div>
    <div class="color-box" style="background:#61CBF4"></div>
    <div class="color-box" style="background:#00A8FF"></div>
    <div class="color-box" style="background:#007BFF"></div>
    <div class="color-box" style="background:#00FF88"></div>
    <div class="color-box" style="background:#00E060"></div>
    <div class="color-box" style="background:#FF0000"></div>
    <div class="color-box" style="background:#FFD500"></div>
    <div class="color-box" style="background:#FF8C00"></div>
    <div class="color-box" style="background:#7F7F7F"></div>
  </div>

  <h2>Brightness & Contrast Variants</h2>
  <div class="grid">
    <div class="color-box" style="background:#61CBF4; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#61CBF4; filter: brightness(0.75) contrast(0.750)"></div>
    <div class="color-box" style="background:#61CBF4; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#61CBF4; filter: brightness(2) contrast(2)"></div>

    <div class="color-box" style="background:#00A8FF; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#00A8FF; filter: brightness(0.75) contrast(0.750)"></div>
    <div class="color-box" style="background:#00A8FF; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#00A8FF; filter: brightness(2) contrast(2)"></div>

    <div class="color-box" style="background:#007BFF; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#007BFF; filter: brightness(0.75) contrast(0.750)"></div>
    <div class="color-box" style="background:#007BFF; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#007BFF; filter: brightness(2) contrast(2)"></div>
    
    <div class="color-box" style="background:#00FF88; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#00FF88; filter: brightness(0.75) contrast(0.75)"></div>
    <div class="color-box" style="background:#00FF88; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#00FF88; filter: brightness(2) contrast(2)"></div>

    <div class="color-box" style="background:#00E060; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#00E060; filter: brightness(0.75) contrast(0.75)"></div>
    <div class="color-box" style="background:#00E060; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#00E060; filter: brightness(2) contrast(2)"></div>

    <div class="color-box" style="background:#FF0000; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#FF0000; filter: brightness(0.75) contrast(0.75)"></div>
    <div class="color-box" style="background:#FF0000; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#FF0000; filter: brightness(2) contrast(2)"></div>

    <div class="color-box" style="background:#FFD500; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#FFD500; filter: brightness(0.75) contrast(0.75)"></div>
    <div class="color-box" style="background:#FFD500; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#FFD500; filter: brightness(2) contrast(2)"></div>

    <div class="color-box" style="background:#FF8C00; filter: brightness(1) contrast(1)"></div>
    <div class="color-box" style="background:#FF8C00; filter: brightness(0.75) contrast(0.75)"></div>
    <div class="color-box" style="background:#FF8C00; filter: brightness(1.2) contrast(1.5)"></div>
    <div class="color-box" style="background:#FF8C00; filter: brightness(2) contrast(2)"></div>
</div>
</body>
</html>
